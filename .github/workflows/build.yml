name: Build

on:
  push:
#    branches: [main]
    tags: ['v*']
#  pull_request:
#    branches: [main]

jobs:
  # ── macOS ARM64 ────────────────────────────────────
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install npm deps
        run: npm ci

      - name: Build
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Printer-Assistant-ARM64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-aarch64-apple-darwin
          path: src-tauri/target/aarch64-apple-darwin/release/printer-assistant
          if-no-files-found: error

  # ── macOS x86_64（ARM runner 交叉编译，避免排队 macos-13） ──
  macos-x86:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install npm deps
        run: npm ci

      - name: Build
        run: npm run tauri build -- --target x86_64-apple-darwin

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Printer-Assistant-x86_64
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-x86_64-apple-darwin
          path: src-tauri/target/x86_64-apple-darwin/release/printer-assistant
          if-no-files-found: error

  # ── Universal Binary ───────────────────────────────
  universal:
    needs: [macos-arm64, macos-x86]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 binary
        uses: actions/download-artifact@v4.2.1
        with:
          name: binary-aarch64-apple-darwin
          path: bin/arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4.2.1
        with:
          name: binary-x86_64-apple-darwin
          path: bin/x86

      - name: lipo → Universal Binary
        run: |
          chmod +x bin/arm64/printer-assistant bin/x86/printer-assistant
          lipo -create \
            bin/arm64/printer-assistant \
            bin/x86/printer-assistant \
            -output printer-assistant
          file printer-assistant

      - name: Upload Universal Binary
        uses: actions/upload-artifact@v4
        with:
          name: Printer-Assistant-Universal
          path: printer-assistant
          if-no-files-found: error

  # ── Windows ─────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm deps
        run: npm ci

      - name: Build
        run: npm run tauri build

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: Printer-Assistant-Windows
          path: src-tauri/target/release/printer-assistant.exe
          if-no-files-found: error

  # ── Release（打 tag 时自动发布） ──────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-arm64, macos-x86, windows, universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 创建 Release 需要写入权限
    steps:
      - name: Download macOS ARM64
        uses: actions/download-artifact@v4.2.1
        with:
          name: Printer-Assistant-ARM64
          path: release

      - name: Download macOS x86_64
        uses: actions/download-artifact@v4.2.1
        with:
          name: Printer-Assistant-x86_64
          path: release

      - name: Download Windows
        uses: actions/download-artifact@v4.2.1
        with:
          name: Printer-Assistant-Windows
          path: release

      - name: Download Universal Binary
        uses: actions/download-artifact@v4.2.1
        with:
          name: Printer-Assistant-Universal
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: release/**
          generate_release_notes: true
