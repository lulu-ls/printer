name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ── macOS ──────────────────────────────────────────
  macos:
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: ${{ matrix.target == 'aarch64-apple-darwin' && 'macos-latest' || 'macos-13' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm deps
        run: npm ci

      - name: Build (${{ matrix.target }})
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Printer-Assistant-${{ matrix.target == 'aarch64-apple-darwin' && 'ARM64' || 'x86_64' }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.dmg
          if-no-files-found: error

      - name: Upload binary for universal merge
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/printer-assistant
          if-no-files-found: error

  # ── Universal Binary（合并两个架构） ──────────────
  universal:
    needs: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-aarch64-apple-darwin
          path: bin/arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-apple-darwin
          path: bin/x86

      - name: lipo → Universal Binary
        run: |
          chmod +x bin/arm64/printer-assistant bin/x86/printer-assistant
          lipo -create \
            bin/arm64/printer-assistant \
            bin/x86/printer-assistant \
            -output printer-assistant
          file printer-assistant

      - name: Upload Universal Binary
        uses: actions/upload-artifact@v4
        with:
          name: Printer-Assistant-Universal
          path: printer-assistant
          if-no-files-found: error

  # ── Windows ─────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm deps
        run: npm ci

      - name: Build
        run: npm run tauri build

      - name: Upload .msi
        uses: actions/upload-artifact@v4
        with:
          name: Printer-Assistant-Windows
          path: src-tauri/target/release/bundle/msi/
          if-no-files-found: warn

  # ── Release（打 tag 时自动发布） ──────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, universal]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS ARM64
        uses: actions/download-artifact@v4
        with:
          name: Printer-Assistant-ARM64
          path: release

      - name: Download macOS x86_64
        uses: actions/download-artifact@v4
        with:
          name: Printer-Assistant-x86_64
          path: release

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: Printer-Assistant-Windows
          path: release

      - name: Download Universal Binary
        uses: actions/download-artifact@v4
        with:
          name: Printer-Assistant-Universal
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**
          generate_release_notes: true
